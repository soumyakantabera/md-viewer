><symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol><symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></symbol><symbol id="i-cup" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></symbol><symbol id="i-cdown" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol><symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol><symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></symbol><symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol><symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M18 2v4h-4M6 22v-4h4"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></symbol><symbol id="i-wrap" viewBox="0 0 24 24"><path d="M3 6h18M3 12h15a3 3 0 1 1 0 6h-4M16 16l-2 2 2 2M3 18h7"/></symbol><symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 7 3 3v2H7v-2l3-3z"/></symbol><symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 7h4M12 12h5M12 17h4"/></symbol><symbol id="i-cright" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol><symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/></symbol><symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M8 13l1.5 5 1.5-4 1.5 4L14 13"/></symbol></defs></svg>
<div class="bar" role="toolbar" aria-label="Main toolbar">
 <div class="brand"><svg viewBox="0 0 208 128" width="32" height="20" style="fill:currentColor"><rect width="198" height="118" x="5" y="5" ry="10" style="stroke:currentColor;stroke-width:10;fill:none"/><path d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z"/></svg>MD Viewer</div>
 <button class="btn on" id="bSide" data-tip="Sidebar (Ctrl+B)" onclick="toggleSide()"><svg class="i"><use href="#i-side"/></svg></button>
 <button class="btn p" data-tip="Open file (Ctrl+O)" onclick="openFiles()"><svg class="i"><use href="#i-folder"/></svg>Open</button>
 <div class="urlbox"><svg class="i"><use href="#i-globe"/></svg><input id="url" placeholder="Paste a .md URL and press Enter  (Ctrl+L)" onkeydown="if(event.key==='Enter')loadUrl()"></div>
 <button class="btn" data-tip="Paste markdown" onclick="paste()"><svg class="i"><use href="#i-clip"/></svg></button>
 <span class="sep"></span>
 <button class="btn" data-tip="Find (Ctrl+F)" onclick="toggleFind()"><svg class="i"><use href="#i-search"/></svg></button>
 <button class="btn" data-tip="Smaller text (Ctrl+-)" onclick="zoom(-1)"><svg class="i"><use href="#i-minus"/></svg></button>
 <button class="btn" data-tip="Larger text (Ctrl+=)" onclick="zoom(1)"><svg class="i"><use href="#i-plus"/></svg></button>
 <button class="btn" id="bWrap" data-tip="Wrap code lines (Alt+Z)" onclick="setCode('wrap')"><svg class="i"><use href="#i-wrap"/></svg></button>
 <button class="btn" id="bSrc" data-tip="Source / Rendered (Ctrl+U)" onclick="toggleSrc()"><svg class="i"><use href="#i-code"/></svg></button>
 <button class="btn" id="bEdit" data-tip="Edit with live preview (Ctrl+E)" onclick="toggleEdit()"><svg class="i"><use href="#i-edit"/></svg></button>
 <button class="btn" id="bPres" data-tip="Present as slides (F5)" onclick="present()"><svg class="i"><use href="#i-play"/></svg></button>
 <span class="sep"></span>
 <button class="btn" data-tip="Export" onclick="event.stopPropagation();menu('exp',this)"><svg class="i"><use href="#i-dl"/></svg></button>
 <button class="btn" data-tip="Fonts, themes &amp; settings" onclick="event.stopPropagation();menu('look',this)"><svg class="i"><use href="#i-type"/></svg>Aa</button>
 <button class="btn" id="bTheme" data-tip="Theme (Ctrl+D)" onclick="theme_()"><svg class="i"><use href="#i-moon"/></svg></button>
 <button class="btn" data-tip="Shortcuts &amp; about (?)" onclick="showHelp()"><svg class="i"><use href="#i-kbd"/></svg></button>
 <div class="prog" id="prog"></div>
</div>
<div id="tabs" role="tablist" aria-label="Open documents"></div>
<input type="file" id="f" accept=".md,.markdown,.txt" hidden>
<div class="main">
 <div id="side"><div class="tabs" role="tablist">
  <button class="tab on" id="t1" role="tab" onclick="tab(1)"><svg class="i"><use href="#i-list"/></svg>Outline</button>
  <button class="tab" id="t3" role="tab" onclick="tab(3)"><svg class="i"><use href="#i-folder"/></svg>Files</button>
  <button class="tab" id="t2" role="tab" onclick="tab(2)"><svg class="i"><use href="#i-clock"/></svg>Recent</button></div>
  <div class="plist" id="toc"></div>
  <div id="files" style="display:none;flex:1;min-height:0;flex-direction:column">
   <div class="ftop"><button class="btn" onclick="openFolder()" data-tip="Open folder (Ctrl+Shift+O)"><svg class="i"><use href="#i-folder"/></svg>Open folder</button><span class="fname" id="fname"></span>
    <button class="btn" id="fref" data-tip="Refresh" onclick="refreshFolder()" style="display:none"><svg class="i"><use href="#i-refresh"/></svg></button><button class="btn" id="fclose" data-tip="Close folder" onclick="closeFolder()" style="display:none"><svg class="i"><use href="#i-x"/></svg></button></div>
   <div class="fsearch"><svg class="i"><use href="#i-search"/></svg><input id="fq" placeholder="Search file names and contents" aria-label="Search files"></div>
   <div class="plist" id="ftree"></div></div>
  <div class="plist" id="rec" style="display:none"></div></div>
 <div id="doc"><textarea id="editor" aria-label="Markdown source" spellcheck="false"></textarea><div id="md"></div></div>
</div>
<div class="status"><span><svg class="i"><use href="#i-file"/></svg><b id="sName">No document</b></span><span class="grow"></span><span id="sLive"></span><span id="sWords"></span><span id="sRead"></span><span id="sPct"></span></div>
<button class="btn" id="top" data-tip="Back to top" onclick="doc.scrollTo(0,0)"><svg class="i"><use href="#i-up"/></svg></button>
<div id="find"><input id="q" placeholder="Find in document"><button class="btn" onclick="findNext(1)"><svg class="i"><use href="#i-cup"/></svg></button><button class="btn" onclick="findNext(0)"><svg class="i"><use href="#i-cdown"/></svg></button><button class="btn" onclick="toggleFind()"><svg class="i"><use href="#i-x"/></svg></button></div>
<div class="menu" id="menu" role="menu"></div>
<div class="ctx" id="ctx" role="menu"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="drop"><svg class="i"><use href="#i-upload"/></svg>Drop a Markdown file to open it</div>
<div id="help" class="modal" role="dialog" aria-label="Shortcuts and about"><div><h3><svg class="i"><use href="#i-kbd"/></svg>Keyboard shortcuts</h3><div id="helpbody"></div>
<div class="hfoot"><span id="ver"></span><button class="btn" onclick="checkUpdate()"><svg class="i"><use href="#i-refresh"/></svg>Check for updates</button></div></div></div>
<div id="lb"><img alt=""></div>
<div id="slides" role="dialog" aria-label="Presentation"><div class="bar2"><i></i></div><div class="sl" id="slc"></div><div class="ctl"><span id="slno"></span><button class="btn" onclick="endPresent()" aria-label="End presentation"><svg class="i"><use href="#i-x"/></svg></button></div></div>
<div class="modal" id="pdfm" role="dialog" aria-label="Export PDF"><div><h3><svg class="i"><use href="#i-dl"/></svg>Export PDF</h3>
 <label>Paper size<select id="pPaper"><option>A4</option><option>Letter</option></select></label>
 <label>Margins<select id="pMargin"><option value="0">None</option><option value="8">Narrow</option><option value="15">Normal</option><option value="25">Wide</option></select></label>
 <label>Print backgrounds and colours<input type="checkbox" id="pBg"></label>
 <div class="row"><button class="btn" onclick="closeModal('pdfm')">Cancel</button><button class="btn p" onclick="doPdf()">Export…</button></div></div></div>
<div class="modal" id="cssm" role="dialog" aria-label="Custom CSS"><div><h3><svg class="i"><use href="#i-code"/></svg>Custom CSS</h3>
 <p style="margin:0 0 8px;color:var(--mut);font-size:13px">Applied to the whole viewer and remembered. Example: <code>#md{max-width:1100px}</code></p>
 <textarea id="cssta" spellcheck="false" aria-label="Custom CSS"></textarea>
 <div class="row"><button class="btn" onclick="saveCss('')">Reset</button><button class="btn" onclick="closeModal('cssm')">Cancel</button><button class="btn p" onclick="saveCss($('cssta').value)">Save</button></div></div></div>
<script src="app.js"></script>
</body></html>

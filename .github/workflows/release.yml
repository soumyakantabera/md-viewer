name: Build installer
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 nsis zip osslsigncode
      - run: npm ci
      - run: ./cpp/build.sh
      - name: Sign installer (optional, see SIGNING.md)
        env:
          CERT_BASE64: ${{ secrets.CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        if: env.CERT_BASE64 != ''
        run: |
          echo "$CERT_BASE64" | base64 -d > cert.pfx
          osslsigncode sign -pkcs12 cert.pfx -pass "$CERT_PASSWORD" -n "MD Viewer" \
            -t http://timestamp.digicert.com -in cpp/dist/MD-Viewer-Setup.exe -out signed.exe
          mv signed.exe cpp/dist/MD-Viewer-Setup.exe
          rm -f cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: MDViewer
          path: |
            cpp/dist/MD-Viewer-Setup.exe
            cpp/dist/MD-Viewer-portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cpp/dist/MD-Viewer-Setup.exe
            cpp/dist/MD-Viewer-portable.zip
          generate_release_notes: true
